{% extends "base.html" %}
{% block title %}Page not found · IshtirafAI{% endblock %}
{% block crumbs %}<b>Not found</b>{% endblock %}
{% block content %}
<div class="error-page">
    <div data-reveal>
        <p class="error-code">404</p>
        <h1 class="mt-2 text-xl font-semibold">This page does not exist</h1>
        <p class="error-message mt-2">The link may be old, or the page was removed in V2.</p>
        <div class="mt-8 flex flex-wrap justify-center gap-3">
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary"><i class="fas fa-house-medical text-sm"></i> Go to overview</a>
            <a href="{{ url_for('qr_scanner') }}" class="btn btn-secondary"><i class="fas fa-qrcode text-sm"></i> Scan device QR</a>
        </div>
    </div>
</div>
{% endblock %}
