<script>
  /* Theme before first paint: saved choice, else the OS setting. */
  (function () {
    var t = null; try { t = localStorage.getItem('ishtirafai-theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var r = document.documentElement; r.setAttribute('data-theme', t); r.classList.add('js');
  })();
</script>
