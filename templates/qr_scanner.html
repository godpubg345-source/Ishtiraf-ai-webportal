<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IshtirafAI Pro Scan</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- QR Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1a237e, #000000);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Scanner Laser */
        .scanner-laser {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(0, 243, 255, 0.8);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.8);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% {
                top: 0;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        /* Corner Animations */
        .corner-border {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #00f3ff;
            transition: all 0.3s ease;
        }

        .pulse-ring {
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.4);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(0, 243, 255, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(0, 243, 255, 0);
            }
        }

        #reader video {
            border-radius: 1rem;
            object-fit: cover;
        }
    </style>
</head>

<body class="flex items-center justify-center p-4">

    <!-- Ambient Background Blobs -->
    <div
        class="fixed top-[-20%] left-[-10%] w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob">
    </div>
    <div
        class="fixed bottom-[-20%] right-[-10%] w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000">
    </div>

    <div
        class="glass-card rounded-3xl p-1 w-full max-w-md relative z-10 transition-all duration-500 hover:shadow-2xl hover:shadow-cyan-500/20">

        <!-- Header -->
        <div class="text-center py-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-500/20 mb-3 pulse-ring">
                <i class="fas fa-qrcode text-cyan-400 text-xl"></i>
            </div>
            <h1
                class="text-2xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                IshtirafAI Scanner
            </h1>
            <div class="flex items-center justify-center gap-2 mt-2">
                <div class="h-2 w-2 rounded-full bg-green-500 animate-pulse"></div>
                <p class="text-gray-400 text-xs tracking-wider uppercase">Secure Enclave v3.2</p>
            </div>
        </div>

        <!-- Scanner Viewport -->
        <div class="relative m-4 rounded-2xl overflow-hidden bg-black/50 border border-white/5 shadow-inner group">
            <div id="reader" class="w-full h-[400px]"></div>

            <!-- Laser Overlay -->
            <div class="scanner-laser pointer-events-none"></div>

            <!-- Corner Markers -->
            <div class="absolute inset-0 pointer-events-none p-6">
                <div class="w-full h-full relative border-2 border-white/10 rounded-lg">
                    <div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-cyan-400 rounded-tl-lg">
                    </div>
                    <div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-cyan-400 rounded-tr-lg">
                    </div>
                    <div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-cyan-400 rounded-bl-lg">
                    </div>
                    <div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-cyan-400 rounded-br-lg">
                    </div>
                </div>
            </div>

            <!-- Status Badge -->
            <div class="absolute bottom-4 left-0 right-0 flex justify-center pointer-events-none">
                <div id="scan-status"
                    class="bg-black/60 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/10 flex items-center gap-2">
                    <i class="fas fa-circle-notch fa-spin text-cyan-400 text-xs"></i>
                    <span class="text-xs font-medium text-cyan-100">Searching...</span>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="p-6 pt-2 space-y-3">
            <!-- Upload Button -->
            <button onclick="document.getElementById('qr-file').click()"
                class="w-full py-3.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 transition-all duration-300 group flex items-center justify-center gap-3">
                <div class="p-1.5 rounded-lg bg-blue-500/20 group-hover:bg-blue-500/30 transition-colors">
                    <i class="fas fa-image text-blue-400"></i>
                </div>
                <span class="text-sm font-medium text-gray-300 group-hover:text-white">Upload from Gallery</span>
            </button>
            <input type="file" id="qr-file" accept="image/*" class="hidden" onchange="scanFromFile(this)">

            <!-- Restart Text -->
            <div class="text-center">
                <button onclick="restartCamera()" class="text-xs text-gray-500 hover:text-cyan-400 transition-colors">
                    Restart Camera Stream
                </button>
            </div>
        </div>
    </div>

    <!-- JS Logic -->
    <script>
        let html5QrCode;
        const statusEl = document.getElementById('scan-status');

        // Initializer
        document.addEventListener('DOMContentLoaded', startScanner);

        function updateStatus(icon, text, colorClass = "text-cyan-400") {
            const spin = icon.includes('spin') ? 'fa-spin' : '';
            statusEl.innerHTML = `
                <i class="fas ${icon} ${spin} ${colorClass} text-xs"></i>
                <span class="text-xs font-medium text-gray-200">${text}</span>
            `;
        }

        function handleQRCode(decodedText) {
            if (html5QrCode) try { html5QrCode.stop(); } catch (e) { }

            // Success Feedback
            updateStatus('fa-check-circle', 'Verified! Redirecting...', 'text-green-400');
            new Audio('/static/sounds/success.mp3').play().catch(() => { });

            // Animation out
            document.querySelector('.scanner-laser').style.background = '#4ade80'; // Green laser

            setTimeout(() => {
                redirectLogic(decodedText);
            }, 600);
        }

        function redirectLogic(text) {
            if (text.startsWith('http')) {
                try {
                    const url = new URL(text);
                    const p = url.searchParams.get('p') || url.searchParams.get('payload');
                    if (p) window.location.href = `/scan?p=${p}`;
                    else window.location.href = text;
                } catch (e) {
                    window.location.href = text;
                }
            } else {
                window.location.href = `/scan?p=${encodeURIComponent(text)}`;
            }
        }

        function scanFromFile(input) {
            if (input.files.length === 0) return;
            const file = input.files[0];
            updateStatus('fa-circle-notch fa-spin', 'Analyzing Image...');

            const html5QrCodeFile = new Html5Qrcode("reader");
            html5QrCodeFile.scanFile(file, true)
                .then(handleQRCode)
                .catch(err => {
                    console.error(err);
                    updateStatus('fa-exclamation-circle', 'Analysis Failed', 'text-red-400');
                    setTimeout(() => updateStatus('fa-circle-notch fa-spin', 'Searching...'), 2000);
                });
        }

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };

            html5QrCode.start({ facingMode: "environment" }, config, handleQRCode)
                .catch(err => {
                    console.log("Rear camera failed, switching to user");
                    html5QrCode.start({ facingMode: "user" }, config, handleQRCode);
                });
        }

        function restartCamera() { location.reload(); }
    </script>
</body>

</html>
